# Deploys apps/web to Vercel, but only after `pnpm check` passes (SFT-9).
#   - pull_request      -> check, then a Preview deployment (URL in the job summary)
#   - push to main      -> check, then a Production deployment (commit SHA + URL in the job summary)
# Vercel's own Git auto-deploy is switched off in apps/web/vercel.json, so this workflow is the
# only path to production. The deploy jobs stay skipped until the repository variable
# VERCEL_DEPLOY is set to "true" and the secrets VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID exist. Setup steps: docs/deploy.md.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  preview:
    name: Preview deployment
    needs: check
    if: github.event_name == 'pull_request' && vars.VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pull Preview settings and env vars from Vercel
        run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes vercel@latest build --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" --meta commit="$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview for \`${{ github.event.pull_request.head.sha }}\`: $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production deployment
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pull Production settings and env vars from Vercel
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      # Once SFT-6 (Prisma) is merged, apply migrations here, before the new code goes live.
      # PROD_DIRECT_URL is a GitHub secret holding the production DIRECT (non-pooled) URL.
      # - name: Apply database migrations
      #   run: pnpm install --frozen-lockfile && pnpm --filter @sift/db exec prisma migrate deploy
      #   env:
      #     DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      #     DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --meta commit="$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production is now commit \`$GITHUB_SHA\` ($url)" >> "$GITHUB_STEP_SUMMARY"
